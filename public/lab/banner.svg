<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Nakusu - side A">
  <title>Nakusu — side A</title>
  <!-- rebobina la cinta antes de devolverla -->
  <defs>
    <linearGradient id="body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a4038"/>
      <stop offset="55%" stop-color="#3a322c"/>
      <stop offset="100%" stop-color="#2b2521"/>
    </linearGradient>

    <linearGradient id="label" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e3dbc8"/>
      <stop offset="100%" stop-color="#cfc5ae"/>
    </linearGradient>

    <radialGradient id="vig" cx="50%" cy="45%" r="72%">
      <stop offset="0%" stop-color="#1d201e" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0b0d0c" stop-opacity="0.85"/>
    </radialGradient>

    <pattern id="grain" width="7" height="7" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="none"/>
      <rect x="0" y="0" width="1" height="1" fill="#6b7f52" opacity="0.16"/>
      <rect x="4" y="3" width="1" height="1" fill="#8a8f8a" opacity="0.10"/>
      <rect x="2" y="5" width="1" height="1" fill="#7b4b3b" opacity="0.10"/>
    </pattern>

    <pattern id="lines" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M0 6 L6 0" stroke="#8a7f68" stroke-width="0.6" opacity="0.18"/>
    </pattern>

    <clipPath id="win">
      <rect x="470" y="206" width="230" height="48" rx="6"/>
    </clipPath>
  </defs>

  <!-- escritorio -->
  <rect width="1200" height="340" fill="#15171a"/>
  <rect width="1200" height="340" fill="url(#grain)"/>
  <rect width="1200" height="340" fill="url(#vig)"/>

  <!-- casete -->
  <g transform="rotate(-1.4 585 170)">
    <rect x="278" y="66" width="614" height="220" rx="12" fill="#0f100f" opacity="0.55"/>
    <rect x="272" y="60" width="614" height="220" rx="12" fill="url(#body)" stroke="#5b5249" stroke-width="1.5"/>
    <rect x="284" y="72" width="590" height="196" rx="8" fill="none" stroke="#241f1b" stroke-width="1.5"/>

    <!-- etiqueta -->
    <rect x="300" y="80" width="558" height="102" rx="4" fill="url(#label)"/>
    <rect x="300" y="80" width="558" height="102" rx="4" fill="url(#lines)"/>
    <rect x="300" y="80" width="558" height="24" rx="4" fill="#42553a"/>
    <rect x="300" y="98" width="558" height="6" fill="#42553a"/>
    <text x="314" y="97" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="700" letter-spacing="3" fill="#dfe3d3">SIDE A</text>
    <text x="844" y="97" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="13" letter-spacing="2" fill="#b9c3a8">C-90 &#183; NORMAL</text>

    <!-- nombre -->
    <text x="330" y="146" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" letter-spacing="7" fill="#2b2f2a">NAKUSU</text>
    <rect x="332" y="155" width="0" height="3" fill="#7b2d3b">
      <animate attributeName="width" values="0;250;250;0" keyTimes="0;0.35;0.85;1" dur="10s" repeatCount="indefinite"/>
    </rect>
    <text x="332" y="173" font-family="'Courier New', Courier, monospace" font-size="14" fill="#6d6558">c&#243;digo &#183; dise&#241;o &#183; ruido de fondo</text>

    <!-- tracklist a la derecha de la etiqueta -->
    <g font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#7a7263">
      <text x="656" y="122">01 huecko</text>
      <text x="656" y="138">02 safezone</text>
      <text x="656" y="154">03 clinica biometrica</text>
      <text x="656" y="170">04 ...</text>
    </g>
    <rect x="646" y="110" width="1" height="64" fill="#a89c86" opacity="0.6"/>

    <!-- ventana de cinta -->
    <rect x="464" y="200" width="242" height="60" rx="8" fill="#14120f" stroke="#5b5249"/>
    <g clip-path="url(#win)">
      <rect x="470" y="206" width="230" height="48" fill="#241d18"/>
      <rect x="470" y="222" width="230" height="16" fill="#4a382c"/>
      <rect x="470" y="227" width="230" height="2" fill="#6b5241" opacity="0.7"/>
      <rect x="470" y="206" width="26" height="48" fill="#0d0c0b" opacity="0.55">
        <animate attributeName="x" values="470;700;470" dur="9s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- carretes -->
    <g>
      <circle cx="430" cy="230" r="42" fill="#1d1916" stroke="#5b5249" stroke-width="1.5"/>
      <g transform="translate(430 230)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/>
          <circle r="27" fill="#3a322c" stroke="#6b6156"/>
          <circle r="11" fill="#15171a"/>
          <g stroke="#6b6156" stroke-width="4" stroke-linecap="round">
            <path d="M0 -28 L0 -13"/>
            <path d="M24 -14 L11 -7"/>
            <path d="M24 14 L11 7"/>
            <path d="M0 28 L0 13"/>
            <path d="M-24 14 L-11 7"/>
            <path d="M-24 -14 L-11 -7"/>
          </g>
        </g>
      </g>
      <circle cx="740" cy="230" r="42" fill="#1d1916" stroke="#5b5249" stroke-width="1.5"/>
      <g transform="translate(740 230)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="11s" repeatCount="indefinite"/>
          <circle r="27" fill="#3a322c" stroke="#6b6156"/>
          <circle r="11" fill="#15171a"/>
          <g stroke="#6b6156" stroke-width="4" stroke-linecap="round">
            <path d="M0 -28 L0 -13"/>
            <path d="M24 -14 L11 -7"/>
            <path d="M24 14 L11 7"/>
            <path d="M0 28 L0 13"/>
            <path d="M-24 14 L-11 7"/>
            <path d="M-24 -14 L-11 -7"/>
          </g>
        </g>
      </g>
    </g>

    <!-- tornillos -->
    <g fill="#574f46">
      <circle cx="292" cy="80" r="3"/>
      <circle cx="866" cy="80" r="3"/>
      <circle cx="292" cy="260" r="3"/>
      <circle cx="866" cy="260" r="3"/>
      <circle cx="579" cy="270" r="3"/>
    </g>
  </g>

  <!-- glitch ocasional -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;0.75;0;0;0.5;0" keyTimes="0;0.62;0.635;0.65;0.9;0.912;0.93" dur="13s" repeatCount="indefinite"/>
    <rect x="300" y="120" width="558" height="12" fill="#7b2d3b" opacity="0.5" transform="translate(9 0)"/>
    <rect x="300" y="140" width="558" height="6" fill="#42553a" opacity="0.5" transform="translate(-11 0)"/>
  </g>

  <!-- stickers -->
  <g transform="rotate(-9 138 92)">
    <rect x="86" y="62" width="104" height="60" rx="4" fill="#3f5138" stroke="#26301f" stroke-width="2"/>
    <text x="138" y="100" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="28" font-weight="700" fill="#dfe3d3">|-/</text>
  </g>

  <g transform="rotate(7 150 250)">
    <rect x="96" y="216" width="108" height="66" rx="3" fill="#cfc5ae" stroke="#9a9280" stroke-width="2"/>
    <rect x="112" y="228" width="76" height="26" fill="#3a322c"/>
    <rect x="126" y="232" width="48" height="18" fill="#cfc5ae"/>
    <rect x="120" y="260" width="60" height="14" fill="#7b7263"/>
    <text x="150" y="271" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="9" fill="#e6e0d0">GUARDAR</text>
  </g>

  <g transform="rotate(6 1058 96)">
    <rect x="996" y="64" width="124" height="64" rx="32" fill="#5a2430" stroke="#3a161e" stroke-width="2"/>
    <circle cx="1024" cy="96" r="9" fill="#c9505f">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="1046" y="103" font-family="'Courier New', Courier, monospace" font-size="18" font-weight="700" letter-spacing="2" fill="#e8d9d5">REC</text>
  </g>

  <g transform="rotate(-5 1054 248)">
    <rect x="988" y="214" width="132" height="68" rx="4" fill="#2a2e2b" stroke="#4a5347" stroke-width="2"/>
    <text x="1004" y="240" font-family="'Courier New', Courier, monospace" font-size="11" fill="#8f9a83">reproduciendo</text>
    <g fill="#6b7f52">
      <rect x="1004" y="252" width="9" height="20"><animate attributeName="height" values="6;20;10;18;6" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="266;252;262;254;266" dur="1.1s" repeatCount="indefinite"/></rect>
      <rect x="1018" y="252" width="9" height="14"><animate attributeName="height" values="18;7;20;9;18" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="254;265;252;263;254" dur="1.3s" repeatCount="indefinite"/></rect>
      <rect x="1032" y="252" width="9" height="20"><animate attributeName="height" values="9;20;6;16;9" dur="0.9s" repeatCount="indefinite"/><animate attributeName="y" values="263;252;266;256;263" dur="0.9s" repeatCount="indefinite"/></rect>
      <rect x="1046" y="252" width="9" height="12"><animate attributeName="height" values="20;10;17;6;20" dur="1.5s" repeatCount="indefinite"/><animate attributeName="y" values="252;262;255;266;252" dur="1.5s" repeatCount="indefinite"/></rect>
      <rect x="1060" y="252" width="9" height="16" fill="#7b2d3b"><animate attributeName="height" values="7;19;11;20;7" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="265;253;261;252;265" dur="1.2s" repeatCount="indefinite"/></rect>
    </g>
  </g>

  <!-- pie -->
  <g font-family="'Courier New', Courier, monospace" font-size="12" fill="#5f6b5a">
    <text x="86" y="322">github.com/Nakusuo</text>
    <text x="1120" y="322" text-anchor="end">est. 2024 &#183; lima</text>
  </g>
  <rect x="86" y="304" width="1034" height="1" fill="#333a33"/>
</svg>
